name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Автодеплой по push: dev → dev-стенд, main → прод.
  # workflow_dispatch остаётся для ручного повторного деплоя без изменений в git.
  workflow_dispatch:
    inputs:
      target:
        description: Стенд для ручного повторного деплоя
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev

permissions:
  contents: read

# Экшены зафиксированы по commitment SHA: теги можно переставить, SHA — нет.
# Комментарий рядом — человекочитаемая версия, для обновления менять обе части.
# Оба экшена работают на Node.js 24, поэтому предупреждение про Node.js 20 ушло.

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base

      - name: Generate definitions.json from template
        # CI не хранит реальные пароли: подставляем фиктивные значения через
        # тот же путь, что и на стенде (check_env.py + envsubst + make).
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = []
          for line in Path(".env.template").read_text(encoding="utf-8").splitlines():
              match = re.match(r"^([A-Z0-9_]+)=", line)
              if match:
                  lines.append(f"{match.group(1)}=ci_test_{match.group(1).lower()}")
              elif line.strip() and not line.startswith("#"):
                  lines.append(line)
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          make generate-config
          python3 - <<'PY'
          import re
          import stat
          from pathlib import Path

          path = Path("rabbitmq/definitions.json")
          text = path.read_text(encoding="utf-8")
          unresolved = re.findall(r"\$[A-Z][A-Z0-9_]*", text)
          assert not unresolved, f"неподставленные переменные: {sorted(set(unresolved))}"
          mode = stat.S_IMODE(path.stat().st_mode)
          assert mode == 0o640, f"права definitions.json: {mode:o}, ожидалось 640"
          print("definitions.json: сгенерирован, переменных нет, права 640")
          PY

      - name: Validate definitions JSON
        run: make validate-json

      - name: Validate docker compose
        # CI не хранит реальный cookie: compose требует лишь непустое значение.
        run: RABBITMQ_ERLANG_COOKIE=ci-placeholder-cookie docker compose config -q

      - name: Run unit tests
        run: make test

# 🚀 Переиспользуемый шаг деплоя лежит в .github/actions/deploy.
# Self-hosted runner обязателен: облачный runner не видит внутреннюю сеть.
# Порядок установки runner и подготовка ключа описаны в docs/GITHUB-DEPLOY.md.
# Адреса, пользователь и путь берутся из repository Variables.

  deploy_dev:
    name: Deploy dev
    needs: validate
    # Не отменять начатый реимпорт definitions на середине: только очередь.
    concurrency:
      group: rabbitmq-deploy-dev
      cancel-in-progress: false
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout (для локального composite-actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Обновить стенд dev и перезапустить сервис
        uses: ./.github/actions/deploy
        with:
          host: ${{ vars.DEV_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          directory: ${{ vars.DEPLOY_DIR }}
          branch: dev
          sha: ${{ github.sha }}
          key_b64: ${{ secrets.DEPLOY_KEY_B64 }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  deploy_prod:
    name: Deploy prod
    needs: validate
    concurrency:
      group: rabbitmq-deploy-prod
      cancel-in-progress: false
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout (для локального composite-actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Обновить стенд prod и перезапустить сервис
        uses: ./.github/actions/deploy
        with:
          host: ${{ vars.PROD_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          directory: ${{ vars.DEPLOY_DIR }}
          branch: main
          sha: ${{ github.sha }}
          key_b64: ${{ secrets.DEPLOY_KEY_B64 }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
