services:
  rabbitmq:
    # Patch-версия + digest: тег 3.13-management «плавающий», образ мог тихо
    # обновиться и изменить поведение без правок в этом репозитории.
    image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    # Никаких rabbitmq-plugins enable при старте: стандартный management уже
    # включён в образе, а shovels в definitions нет. Если появятся — описать
    # декларативно через смонтированный rabbitmq/enabled_plugins.

    ports:
      # AMQP для локальной сети (доступ из других контейнеров)
      - "5672:5672"
      # Management UI
      - "15672:15672"

    environment:
      # Erlang Cookie: без явного значения compose упадёт, а не подставит дефолт
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in .env (make generate-cookie)}

    volumes:
      - ./data:/var/lib/rabbitmq
      - ./logs:/var/log/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    networks:
      - rabbitmq_net

    # Хардненинг
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    # Проверка здоровья контейнера
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Лимиты по эталону проектов: deploy.resources Compose не гарантирует,
    # поэтому используем сервисные ключи (1G RAM + 1G swap, 2 CPU).
    mem_limit: 1G
    memswap_limit: 2G
    cpus: "2.0"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  rabbitmq_net:
    driver: bridge
