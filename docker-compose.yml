services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    # Включаем полезные плагины при старте
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_shovel_management &&
             rabbitmq-server"

    ports:
      # AMQP для локальной сети (доступ из других контейнеров)
      - "5672:5672"
      # Management UI
      - "15672:15672"

    environment:
      # Erlang Cookie для безопасности кластеризации
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:-default_cookie_change_me}

    volumes:
      - ./data:/var/lib/rabbitmq
      - ./logs:/var/log/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    networks:
      - rabbitmq_net

    # Хардненинг
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    # Проверка здоровья контейнера
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Ограничение ресурсов + логирование
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  rabbitmq_net:
    driver: bridge
